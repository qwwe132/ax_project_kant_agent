[project]
name = "kant-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "qwwe132", email = "qwwe1321@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "rank-bm25>=0.2.2",
    "langchain-community>=0.4",
    "langchain-postgres>=0.0.16",
    "psycopg[binary,pool]>=3.2",
    "sentence-transformers>=3",
    "streamlit>=1.67.0",
    "requests>=2.34.2",
    "pandas>=3.1.1",
    "openpyxl>=3.1.5",
    "langchain-classic>=1.1.0",
]

[project.scripts]
kant-agent = "kant_agent:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
